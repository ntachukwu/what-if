[project]
name = "what-if"
version = "0.1.0"
description = "AI-powered TikTok video remixer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "ffmpeg-python>=0.2.0",
    "moviepy>=2.2.0",
    "opencv-python>=4.10.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "pydoclint>=0.5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["domain*", "app*", "adapters*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=domain --cov=app --cov=adapters --cov-report=term-missing"

[tool.ruff]
exclude = ["\\.git|tests/"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
